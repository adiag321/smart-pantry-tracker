name: Weekly grocery data scrape

on:
  schedule:
    # Every Sunday at 2:00 AM UTC (PRD section 3A, step 1)
    - cron: "0 2 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scripts/scraper
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        working-directory: scripts/scraper
        env:
          WALMART_STORE_ID: ${{ secrets.WALMART_STORE_ID }}
          HEB_STORE_ID: ${{ secrets.HEB_STORE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python main.py

      # Commits the new CSVs back to main. This is what resets GitHub's
      # 60-day no-activity clock that would otherwise disable the
      # `schedule` trigger above (PRD section 5) - it must run every time,
      # even if the CSV diff is empty, so "git-auto-commit" skipping an
      # empty diff silently is fine; what matters is this step attempting
      # a commit on a regular cadence.
      - name: Auto-commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: weekly grocery data refresh"
          file_pattern: "data/*.csv"
